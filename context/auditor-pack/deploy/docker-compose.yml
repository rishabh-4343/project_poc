services:
  postgres:
    image: postgres:17
    container_name: auditor-pg
    environment:
      POSTGRES_PASSWORD: devpassword
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: auditor-ch
    environment:
      CLICKHOUSE_PASSWORD: devpassword
    ports:
      - "8123:8123"   # HTTP (clients, backend)
      - "9000:9000"   # native protocol
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes: [chdata:/var/lib/clickhouse]

volumes:
  pgdata: {}
  chdata: {}
